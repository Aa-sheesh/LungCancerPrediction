<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <!-- Navbar -->

  <div class="container">
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">Lung Cancer Detection</h1>
        <p>Upload your CT scan image for analysis</p>
      </div>
      <div class="card-body">
        <form id="uploadForm">
          <div class="mb-3">
            <label for="imageInput" class="form-label">Select Image</label>
            <input type="file" class="form-control" id="imageInput" accept="image/*" required>
          </div>
          <!-- Image preview -->
          <img id="preview" src="#" alt="Image Preview" style="display: none;">
          <button type="submit" class="btn btn-primary w-100 mt-3">Analyze Image</button>
        </form>
        <div id="result" class="mt-4"></div>
        <!-- Download Report Button (initially hidden) -->
        <button id="downloadBtn" class="btn btn-success mt-3" style="display: none;">Download Report</button>
        <div class="mt-4">
          <canvas id="predictionChart" width="400" height="200"></canvas>
        </div>
      </div>
    </div>
  </div>
  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="../static/script.js"></script>
</body>
