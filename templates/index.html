<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lung Cancer Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <!-- <img src="/assets/ak3n_89dr_230817.jpg" alt="Lung Logo" width="45" height="45" class="me-2"> -->
        <span class="fw-bold">Lung Cancer Detection</span>
      </a>
    </div>
  </nav>

  <main class="container my-5">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-primary text-white text-center py-4">
        <h2 class="mb-0">Analyze Your CT Scan</h2>
        <p class="mb-0">Upload an image for a quick detection analysis</p>
      </div>
      <div class="card-body p-4">
        <form id="uploadForm">
          <div class="mb-3">
            <label for="imageInput" class="form-label">Select Image</label>
            <input type="file" class="form-control" id="imageInput" accept="image/*" required>
          </div>
          <!-- Image preview -->
          <div class="text-center mb-3">
            <img id="preview" src="#" alt="Image Preview" class="img-fluid rounded" style="display: none;">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Analyze Image</button>
        </form>
        <div id="result" class="mt-4 fs-5 text-center"></div>
        <!-- Download Report Button (initially hidden) -->
        <div class="text-center">
          <button id="downloadBtn" class="btn btn-success mt-3" style="display: none;">Download Report</button>
        </div>
        <div class="mt-4">
          <canvas id="predictionChart" width="400" height="200"></canvas>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="/static/script.js"></script>
</body>
</html>
